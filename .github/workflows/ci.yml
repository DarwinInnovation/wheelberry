name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build proxy-client (foundation)
        run: pnpm --filter @wheelberry/proxy-client build

      - name: Typecheck all
        run: pnpm -r typecheck

      - name: Build all
        run: pnpm --workspace-concurrency=1 -r build
